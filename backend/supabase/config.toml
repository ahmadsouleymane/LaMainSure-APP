# Configuration Supabase locale (générée et complétée à la main)
# Documentation : https://supabase.com/docs/guides/cli/config

project_id = "lamain-sure-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "lamainsure://"
additional_redirect_urls = ["lamainsure://**", "exp://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"

# Templates email : les fichiers HTML sont dans ./templates/ et doivent être
# copiés manuellement dans Dashboard → Auth → Email Templates pour la prod.
# (Les bloc [auth.email.template.*] ne sont utiles qu'avec `supabase start` local Docker.)

# SMS / téléphone : volontairement désactivé. Auth = email uniquement.
[auth.sms]
enable_signup = false
enable_confirmations = false

# Google / Apple : à activer dans le dashboard cloud, pas en local pour l'instant.
[auth.external.google]
enabled = false
[auth.external.apple]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.notify-push]
verify_jwt = false   # déclenchée par DB webhook (pas d'auth user)

[functions.report-webhook]
verify_jwt = false   # déclenchée par DB webhook

[functions.payment-webhook]
verify_jwt = false   # déclenchée par provider externe (signature HMAC vérifiée dans la fn)

[functions.kyc-review]
verify_jwt = true    # appelée par admin authentifié

[functions.delete-my-account]
verify_jwt = true    # user authentifié seulement

[functions.export-my-data]
verify_jwt = true    # user authentifié seulement
