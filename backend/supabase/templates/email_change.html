<!doctype html>
<html lang="fr">
  <body style="margin:0; padding:0; background:#f6f6f6; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#222;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f6f6; padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:520px; background:#ffffff; border-radius:12px; overflow:hidden;">
            <tr>
              <td style="padding:32px 32px 8px 32px;">
                <h1 style="margin:0 0 8px 0; font-size:22px; font-weight:700;">La Main Sûre</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 24px 32px;">
                <h2 style="margin:0 0 12px 0; font-size:18px; font-weight:600;">Confirme ta nouvelle adresse email</h2>
                <p style="margin:0 0 20px 0; font-size:15px; line-height:1.5;">
                  Tu as demandé à changer l'email associé à ton compte. Clique sur le bouton ci-dessous
                  pour confirmer cette nouvelle adresse.
                </p>
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block; background:#000; color:#fff; text-decoration:none;
                          padding:14px 22px; border-radius:8px; font-weight:600; font-size:15px;">
                  Confirmer l'email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px 32px; border-top:1px solid #eee;">
                <p style="margin:0; font-size:12px; color:#999;">
                  Si tu n'as pas demandé ce changement, contacte-nous immédiatement.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
